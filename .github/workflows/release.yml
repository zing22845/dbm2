name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries (no libc/OpenSSL runtime dependency)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # macOS: Apple Silicon only
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows: x86_64 only
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release -p dbm-cli"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pkg="dbm-${version}-${{ matrix.target }}"
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/dbm"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          cp "${bin}" dist/
          cp README.md LICENSE dist/
          tar -czf "${pkg}.tar.gz" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          else
            shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          fi
          ls -l "${pkg}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dbm-*.tar.gz
            dbm-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body_path: .github/RELEASE_NOTES.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          generate_release_notes: true
