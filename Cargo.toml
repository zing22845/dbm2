[workspace]
resolver = "3"
members = [
    "crates/dbm-core",
    "crates/dbm-discovery",
    "crates/dbm-driver-pg",
    "crates/dbm-store",
    "crates/dbm-cli",
    "crates/dbm-tui2",
    "third_party/edtui",
]
default-members = ["crates/dbm-cli"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/zing22845/dbm2"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
arboard = "3.6.1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-rust_decimal-1"] }
ratatui = "0.30.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url = "2"
webpki-roots = "1"
zeroize = { version = "1", features = ["derive"] }

dbm-discovery = { path = "crates/dbm-discovery" }
dbm-core = { path = "crates/dbm-core" }
dbm-driver-pg = { path = "crates/dbm-driver-pg" }
dbm-store = { path = "crates/dbm-store" }
edtui = { path = "third_party/edtui" }

[profile.release]
lto = true
codegen-units = 1
strip = true
