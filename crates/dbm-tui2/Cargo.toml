[package]
name = "dbm-tui2"
description = "DBM terminal UI - TEA architecture with nested features and a central message router (skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dbm-tui2"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
dbm-core = { workspace = true }
dbm-discovery = { workspace = true }
dbm-driver-pg = { workspace = true }
dbm-store = { workspace = true }
edtui = { workspace = true }
futures = "0.3"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used by
# `common::utils::text_width::wrapped_line_count` to size pane footers exactly as
# the renderer wraps them. Still unstable in 0.30.2 (the latest); see the
# rationale and fallback noted on `wrapped_line_count`.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

[lints.clippy]
# Tests commonly build a state with `Foo::default()` then assign a few fields;
# the struct-update rewrite the lint demands is more verbose and less readable
# there. Production code stays warning-free either way.
field_reassign_with_default = "allow"
