[package]
name = "dbm-tui2"
description = "DBM terminal UI - TEA architecture with nested features and a central message router (skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dbm-tui2"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
dbm-core = { workspace = true }
dbm-discovery = { workspace = true }
dbm-store = { workspace = true }
futures = "0.3"
ratatui = { workspace = true }
ratatui-themes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
